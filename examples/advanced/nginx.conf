# Independent HTTP lab. Run with this directory as the Nginx prefix.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events { worker_connections 1024; }

http {
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    access_log logs/access.log;
    default_type text/html;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream spring_pool {
        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
        server 127.0.0.1:8083;
    }

    server {
        listen 127.0.0.1:8090;
        server_name localhost;

        location = / {
            root html;
            try_files /index.html =404;
        }

        location /ws/ {
            proxy_pass http://spring_pool;
            # Setting any proxy_set_header here replaces the inherited header list.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        location = /api/events {
            proxy_pass http://spring_pool;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 20s;
            add_header Cache-Control no-cache;
        }

        location = /api/upload {
            client_max_body_size 2m;
            proxy_pass http://spring_pool;
        }

        location /private/ {
            auth_basic "Nginx learning lab";
            auth_basic_user_file credentials.htpasswd;
            # /private/api/server1 becomes /api/server1.
            proxy_pass http://spring_pool/;
        }

        location /api/ { proxy_pass http://spring_pool; }
        location / { return 404; }
    }

    server {
        listen 127.0.0.1:8091 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 127.0.0.1:8091;
        server_name app1.test;
        location /api/ { proxy_pass http://127.0.0.1:8081; }
        location / { return 404; }
    }

    server {
        listen 127.0.0.1:8091;
        server_name app2.test;
        location /api/ { proxy_pass http://127.0.0.1:8082; }
        location / { return 404; }
    }
}
